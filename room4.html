<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 4 - St. Eric Hospital</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="room4.css">
</head>
<body>
  <div id="room" data-room="room4"></div>

  <div id="dialogueBox" class="dialogueStyle center-content hidden">
    <p id ="dialogueText"></p>
    <button onclick="skipDialogue()">Close Dialogue</button>
  </div>

  <div id="itemDiv" style = "width: 7.5%; height: 15%; position: absolute; top: 84%; right: 45%; outline: 6px solid #030303;" class="center-content hidden">
    <img id="itemSlot" style="height: 100%; width: auto;"src=""/>
  </div>

  <div style="width: 100%; height: 100%; z-index: 10; opacity: 1; background-image: tiles/objects/table_left;" id="tableModal" class="hidden">
    <div></div>
  </div>


  <div id="vaccineModal" class="modal center-content hidden">
      <span class="close" onclick="closeModal()">&times;</span>
      <div class="nextBox clicky" onclick="nextModal()">
        <img src="overlay/right arrow.png"/>
      </div>

      <div class="modal-body center-content">
        <div class="row center-content">
        <img class="clicky" style="position: absolute; top: 10px; right: 100px; height: 50%; width: auto;" src="overlay/redVaccine.png" onclick="pickUpVaccine(this)"/>
        <img style="position: absolute; top: 385px; right: 0px; height: auto; width: 25%;" src="overlay/grave pigpen.png"/>
 
        <img class="clicky" style="position: absolute; top: 10px; right: 750px; height: 50%; width: auto;" src="overlay/greenVaccine.png" onclick="pickUpVaccine(this)"/>
        <img style="position: absolute; top: 385px; right: 620px; height: auto; width: 25%;" src="overlay/expire pigpen.png"/>
        </div>
        <div class="row center-content">
          <img class="clicky" style="position: absolute; top: 220px; right: 1100px; height: 50%; width: auto;" src="overlay/blueVaccine.png" onclick="pickUpVaccine(this)"/>
          <img style="position: absolute; top: 595px; right: 940px; height: auto; width: 25%;" src="overlay/survive pigpen.png"/>
        
          <img class="clicky" style="position: absolute; top: 220px; right: 400px; height: 50%; width: auto;" src="overlay/orangeVaccine.png" onclick="pickUpVaccine(this)"/>
          <img style="position: absolute; top: 595px; right: 250px; height: auto; width: 25%;" src="overlay/death pigpen.png"/>

        </div>
      </div>
    </div>
    
    <div id = "pigpenModal" class="modal center-content hidden">
      <span class="close" onclick="closeModal()">&times;</span>
      <div class="nextBox clicky" onclick="nextModal()">
        <img src="overlay/right arrow.png"/>
      </div>
      <div class="modal-body center-content">
        <img style="position: absolute; top: 10%; right: 7%;" src="overlay/pigpenkey.webp"/>
      </div>
    </div>
  
  <audio id="equipSound" src="sounds/equipSound.mp3"></audio>
  <script src="engine.js"></script>
  <script src="room4.js"></script>
</body>
</html>
