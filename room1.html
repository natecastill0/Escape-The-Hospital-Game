
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 1 - St. Eric Hospital</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div id="room" data-room="room1"></div>

  <div id="modal" class="hidden">
    <div id="modal-box">
      <p id="modal-text"></p>
      <img id="modal-image" class="hidden" alt="">

      <!-- Fuse Box Puzzle -->
      <div id="wire-puzzle" class="hidden">

        <div class="wire-board">
          <img
            src="tiles/objects/fuse_box_puzzle.png"
            alt="Open fuse box"
            class="wire-image"
          >

          <button class="wire-button wire-left wire-red"
            data-color="red"></button>

          <button class="wire-button wire-left wire-yellow"
            data-color="yellow"></button>

          <button class="wire-button wire-left wire-blue"
            data-color="blue"></button>

          <button class="wire-button wire-right wire-blue"
            data-color="blue"></button>

          <button class="wire-button wire-right wire-red"
            data-color="red"></button>

          <button class="wire-button wire-right wire-yellow"
            data-color="yellow"></button>
        </div>

        <p id="wire-message">
          Select a wire on the left, then its match on the right.
        </p>

      </div>

      <button id="modal-close">Close</button>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="room1.js"></script>
</body>
</html>
